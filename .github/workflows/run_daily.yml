name: Daily Auto Commit

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set dynamic branch name and date
      run: |
        START_SEC=$(TZ="Europe/Tallinn" date -d "2026-05-23 00:00:00" +%s)
        CURRENT_SEC=$(TZ="Europe/Tallinn" date +%s)
        DIFF_SEC=$(( CURRENT_SEC - START_SEC ))
        DAYS=$(( DIFF_SEC / 86400 ))
        WEEK=$(( (DAYS / 7) + 1 ))
        if [ $WEEK -gt 4 ]; then WEEK=4; fi
        if [ $WEEK -lt 1 ]; then WEEK=1; fi
        
        DAY_NUMBER=$(( DAYS + 1 ))
        FORMATTED_DATE=$(TZ="Europe/Tallinn" date +"%Y-%m-%d")
        
        echo "BRANCH_NAME=week$WEEK" >> $GITHUB_ENV
        echo "COMMIT_MSG=$FORMATTED_DATE: Päev $DAY_NUMBER" >> $GITHUB_ENV

    - run: python auto_commit.py

    - name: Commit and Push changes
      run: |
        git config user.name "SofijaBeljakova"
        git config user.email "sofija.beljakova@tptlive.ee"
        
        if [ ! -f README.md ]; then
          touch README.md
        fi
        
        git fetch origin $BRANCH_NAME:$BRANCH_NAME || true
        git checkout $BRANCH_NAME || git checkout -b $BRANCH_NAME
        
        git add README.md
        git commit -m "$COMMIT_MSG" || echo "No changes to commit"
        git push origin $BRANCH_NAME
